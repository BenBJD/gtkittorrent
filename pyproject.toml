[project]
name = "gtkittorrent"
version = "0.1.0"
description = "Modern GTK4 and Libadwaita frontend for qBittorrent"
readme = "README.md"
authors = [
    { name = "Ben Davison", email = "benjdavison02@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pygobject>=3.58.1",
    "pygobject-stubs>=2.20.0",
    "qbittorrent-api>=2026.10.1",
]

[project.scripts]
gtkittorrent = "gtkittorrent.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
